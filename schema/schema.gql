  sendEmail: Boolean!
}

input CondominiumInput {
  name: String!

  """CNPJ (opcional)."""
  document: String
  city: String!

  """UF."""
  state: String!
}

input CreateUnitsInput {
  """Bloco ou torre."""
  block: String

  """Números e faixas: "101-104, 201"."""
  numbers: String!
}

input UpdateUnitInput {
  block: String
  number: String!
}

input CreateEnrollmentInviteInput {
  label: String!

  """Validade em dias (1 a 30)."""
  validDays: Int!
}

"""Dados do cadastro (formulário ou correção)."""
input EnrollmentDataInput {
  fullName: String!
  email: String!
  phone: String!

  """
  Unidade (obrigatória quando o condomínio tem unidades). Na aprovação, ausente mantém a escolhida.
  """
  unitId: ID
}

input SubmitEnrollmentInput {
  formToken: String!
  data: EnrollmentDataInput!

  """Aceite do uso dos dados (LGPD)."""
  consent: Boolean!

  """Foto de perfil em base64 (JPEG, PNG ou WebP, até 2 MB)."""
  photo: String
}

input LoginInput {
  """Usuário ou e-mail."""
  login: String!
  password: String!
}

input ChangePasswordInput {
  currentPassword: String!
  newPassword: String!
}

input UpdateMyProfileInput {
  name: String!
  email: String!
}

input VerifyRecoveryCodeInput {
  login: String!
  code: String!
}

input ResetPasswordInput {
  resetToken: String!
  newPassword: String!
}

input CreateUserInput {
  name: String!
  email: String!

  """Login: 3 a 32 caracteres (a-z, 0-9, ., -, _). Vazio: gerado do nome."""
  username: String

  """USER (morador) ou ADMIN (gestor)."""
  group: UserGroup!
  unitId: ID
}

input UpdateUserInput {
  name: String
  email: String
  username: String
  group: UserGroup

  """Ausente: não muda. null: sem unidade."""
  unitId: ID
}

input SetUserPermissionsInput {
  userId: ID!

  """true descarta as exceções e volta ao padrão do grupo."""
  useGroupDefaults: Boolean!

  """Conjunto completo desejado (ignorado com useGroupDefaults)."""
  permissions: [Permission!]
}

"""PushSubscription do navegador (PushManager)."""
input PushSubscriptionInput {
  endpoint: String!

  """Chave pública do aparelho (base64url)."""
  p256dh: String!

  """Segredo de autenticação (base64url)."""
  auth: String!
}

"""O formulário completo do espaço."""
input SpaceInput {
  name: String!
  kind: SpaceKind!
  description: String
  capacity: Int
  usageRules: String
  rules: SpaceRulesInput!
}

input SpaceRulesInput {
  openingHours: [OpeningHoursInput!]!
  slotMinutes: Int!
  minAdvanceHours: Int!
  maxAdvanceDays: Int!
  unitLimit: UnitLimitInput
  requiresApproval: Boolean!
  cancelUntilHours: Int!
}

input OpeningHoursInput {
  """0 = domingo … 6 = sábado."""
  weekday: Int!

  """"HH:MM"."""
  opensAt: String!

  """"HH:MM" ("24:00" = até meia-noite)."""
  closesAt: String!
}

input UnitLimitInput {
  count: Int!
  period: LimitPeriod!
}

input SupportRequestInput {
  category: SupportCategory!
  subject: String!
  message: String!
}
